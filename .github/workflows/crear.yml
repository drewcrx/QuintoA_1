name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repo
      - uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Instalar dependencias (incluye pytest si está en requirements)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Ejecutar tests
      - name: Test with pytest
        run: pytest

      # 5. Ejecutar app (opcional, puede fallar si no es CLI)
      - name: Ejecutar la app
        run: python app.py

      # 6. Simulación deploy
      - name: Simular el deploy
        run: echo "Simular que se está desplegando"

      # 7. Login en GitHub Container Registry
      - name: Login en GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 8. Construir imagen Docker
      - name: Construir la imagen de Docker
        run: docker build -t ghcr.io/drewcrx/hello-andrew:1.0.0 .

      # 9. Push imagen a GHCR
      - name: Push imagen a GHCR
        run: docker push ghcr.io/drewcrx/hello-andrew:1.0.0 